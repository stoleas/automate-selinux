---
- name: Discover VM for AVC log collection
  hosts: kvm_hosts
  become: true
  tags:
    - collect
  tasks:
    - name: Discover VM IP address
      ansible.builtin.shell: |
        BASE=$(ip -4 -o addr show {{ vm_bridge }} | awk '{print $4}' | cut -d/ -f1)
        BASE=${BASE%.*}
        for i in $(seq 1 254); do
          ping -c 1 -W 1 ${BASE}.$i &>/dev/null &
        done
        wait
        virsh domifaddr {{ vm_name }} --source arp | grep -oP '\d+\.\d+\.\d+\.\d+'
      register: _vm_ip
      retries: 3
      delay: 5
      until: _vm_ip.stdout | trim | length > 0
      changed_when: false

    - name: Add VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        ansible_host: "{{ _vm_ip.stdout | trim }}"
        ansible_user: "{{ vm_user_name | default('ansible') }}"
        groups: rhel_vms

- name: Collect AVC denials and audit2allow output
  hosts: "{{ vm_name | default('selinux-demo') }}"
  become: true
  any_errors_fatal: true
  tags:
    - collect
  roles:
    - role: selinux_collect
