---
- name: Collect AVC denials and audit2allow output
  hosts: selinux-demo
  become: true
  any_errors_fatal: true
  tags:
    - collect
    - notify
  roles:
    - role: selinux_collect

- name: Send event to EDA webhook
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tags:
    - notify
  tasks:
    - name: Read AVC denials
      ansible.builtin.slurp:
        src: "{{ report_output_dir }}/avc-denials.log"
      register: _avc_file

    - name: Read audit2allow suggestions
      ansible.builtin.slurp:
        src: "{{ report_output_dir }}/audit2allow-suggestions.txt"
      register: _audit2allow_file
      failed_when: false

    - name: Set event payload facts
      ansible.builtin.set_fact:
        _avc_text_full: "{{ _avc_file.content | b64decode }}"
        _audit2allow_text_full: "{{ (_audit2allow_file.content | b64decode) if (_audit2allow_file.content is defined) else '' }}"

    # Orchestrator agentic nodes reject prompts > 10000 chars. The workflow
    # prompt wraps these fields, so keep headroom (~7000 + ~1500 + template).
    - name: Truncate AVC / audit2allow payloads for Orchestrator prompt limit
      ansible.builtin.set_fact:
        _avc_text: "{{ _avc_text_full[:7000] }}"
        _audit2allow_text: "{{ _audit2allow_text_full[:1500] }}"
        _avc_truncated: "{{ _avc_text_full | length > 7000 }}"
        _audit2allow_truncated: "{{ _audit2allow_text_full | length > 1500 }}"

    - name: Send SELinux analysis event to EDA
      ansible.builtin.uri:
        url: "{{ eda_webhook_url }}"
        method: POST
        body_format: json
        body:
          action: selinux_analysis
          host: "{{ vm_name | default('selinux-demo') }}"
          environment: "{{ demo_environment | default('dev') }}"
          force_route: "{{ force_route | default('') }}"
          avc_count: "{{ _avc_text_full.split('\n') | select | length }}"
          avc_denials: "{{ _avc_text }}"
          audit2allow_output: "{{ _audit2allow_text }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
        headers:
          Content-Type: application/json
        url_username: "{{ eda_webhook_user }}"
        url_password: "{{ eda_webhook_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 201, 202]
      register: _eda_response

    - name: Display notification summary
      ansible.builtin.debug:
        msg: |
          === EDA Notification Sent ===
          Endpoint: {{ eda_webhook_url }}
          Action: selinux_analysis
          Environment: {{ demo_environment | default('dev') }}
          Force route: {{ force_route | default('(none)') }}
          AVC denials (full/sent chars): {{ _avc_text_full | length }}/{{ _avc_text | length }}{{ ' [truncated]' if _avc_truncated else '' }}
          audit2allow chars: {{ _audit2allow_text_full | length }}/{{ _audit2allow_text | length }}{{ ' [truncated]' if _audit2allow_truncated else '' }}
          Response: {{ _eda_response.status }}
