---
- name: Generate SELinux analysis report
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tags:
    - report
  tasks:
    - name: Read AI analysis from file
      ansible.builtin.slurp:
        src: "{{ report_output_dir }}/ai-analysis.json"
      register: _analysis_file
      failed_when: false

    - name: Extract raw AI text (prefer file, fall back to extra var)
      ansible.builtin.set_fact:
        _ai_raw: "{{ (_analysis_file.content | b64decode) if (_analysis_file.content is defined) else (selinux_analysis_json | default('{}')) }}"

    - name: Strip markdown code fences if present
      ansible.builtin.set_fact:
        _ai_json: "{{ _ai_raw | regex_replace('(?s)^```json\\s*', '') | regex_replace('(?s)\\s*```\\s*$', '') }}"

    - name: Parse AI analysis JSON
      ansible.builtin.set_fact:
        selinux_analysis: "{{ _ai_json | from_json }}"

    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ report_output_dir }}"
        state: directory
        mode: "0755"
      failed_when: false

    - name: Render SELinux report
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/selinux-report.md.j2"
        dest: "{{ report_output_dir }}/selinux-report.md"
        mode: "0644"
      failed_when: false

    - name: Display report location
      ansible.builtin.debug:
        msg: "Report generated: {{ report_output_dir }}/selinux-report.md"
