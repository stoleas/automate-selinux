---
- name: Generate SELinux analysis report
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tags:
    - report
  tasks:
    - name: Read AI analysis from file
      ansible.builtin.slurp:
        src: "{{ report_output_dir }}/ai-analysis.json"
      register: _analysis_file
      failed_when: false
      ignore_errors: true

    - name: Debug available inputs
      ansible.builtin.debug:
        msg:
          - "file_content defined: {{ _analysis_file.content is defined }}"
          - "file_failed: {{ _analysis_file.failed | default(false) }}"
          - "selinux_analysis_json defined: {{ selinux_analysis_json is defined }}"
          - "selinux_analysis_json type: {{ selinux_analysis_json | default('UNDEFINED') | type_debug }}"
          - "selinux_analysis_json value (first 300): {{ (selinux_analysis_json | default('UNDEFINED')) | string | truncate(300) }}"

    - name: Set AI analysis from extra var (string input)
      ansible.builtin.set_fact:
        selinux_analysis: "{{ (selinux_analysis_json | regex_replace('(?s)^```json\\s*', '') | regex_replace('(?s)\\s*```\\s*$', '')) | from_json }}"
      when: selinux_analysis_json is defined and selinux_analysis_json | type_debug == 'str' and selinux_analysis_json | length > 0

    - name: Set AI analysis from extra var (dict input)
      ansible.builtin.set_fact:
        selinux_analysis: "{{ selinux_analysis_json }}"
      when: selinux_analysis_json is defined and selinux_analysis_json is mapping

    - name: Set AI analysis from file (fallback)
      ansible.builtin.set_fact:
        selinux_analysis: "{{ _analysis_file.content | b64decode | from_json }}"
      when: selinux_analysis is not defined and _analysis_file.content is defined and not (_analysis_file.failed | default(true))

    - name: Set empty analysis (no data available)
      ansible.builtin.set_fact:
        selinux_analysis:
          summary: "No AI analysis data available"
          findings: []
          audit2allow_assessment: "N/A"
      when: selinux_analysis is not defined

    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ report_output_dir }}"
        state: directory
        mode: "0755"
      failed_when: false

    - name: Render SELinux report
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/selinux-report.md.j2"
        dest: "{{ report_output_dir }}/selinux-report.md"
        mode: "0644"

    - name: Read rendered report for display
      ansible.builtin.slurp:
        src: "{{ report_output_dir }}/selinux-report.md"
      register: _report_file

    - name: Display full report in job output
      ansible.builtin.debug:
        msg: "{{ _report_file.content | b64decode }}"

    - name: Capture report content for second play
      ansible.builtin.set_fact:
        _report_md: "{{ _report_file.content | b64decode }}"
        _report_timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.time | regex_replace(':', '-') }}"

    - name: Pass report to Orchestrator via set_stats
      ansible.builtin.set_stats:
        data:
          selinux_report_md: "{{ _report_md }}"
        per_host: false

    - name: Display report location
      ansible.builtin.debug:
        msg: "Report generated: {{ report_output_dir }}/selinux-report.md"

- name: Publish report to Obsidian vault via VM git repo
  hosts: "{{ vm_name | default('selinux-demo') }}"
  gather_facts: false
  become: false
  tags:
    - report
  vars:
    _obsidian_repo: /home/equail/projects/obsidian
    _report_dir: "{{ _obsidian_repo }}/Areas/selinux-lab/reports"
    _timestamp_file: "{{ hostvars['localhost']['_report_timestamp'] }}.report.md"
    _report_md_content: "{{ hostvars['localhost']['_report_md'] }}"
  tasks:
    - name: Ensure report directory exists in obsidian repo
      ansible.builtin.file:
        path: "{{ _report_dir }}"
        state: directory
        mode: "0755"

    - name: Pull latest obsidian repo
      ansible.builtin.command:
        cmd: git pull --ff-only
        chdir: "{{ _obsidian_repo }}"
      register: _git_pull
      changed_when: "'Already up to date' not in _git_pull.stdout"

    - name: Write timestamped report to obsidian repo
      ansible.builtin.copy:
        dest: "{{ _report_dir }}/{{ _timestamp_file }}"
        content: "{{ _report_md_content }}"
        mode: "0644"
      register: _report_write

    - name: Git add report
      ansible.builtin.command:
        cmd: "git add {{ _report_dir }}/{{ _timestamp_file }}"
        chdir: "{{ _obsidian_repo }}"
      when: _report_write.changed

    - name: Git commit report
      ansible.builtin.command:
        cmd: "git commit -m 'SELinux report: {{ _timestamp_file }}'"
        chdir: "{{ _obsidian_repo }}"
      register: _git_commit
      changed_when: "'nothing to commit' not in _git_commit.stdout"
      when: _report_write.changed

    - name: Git push report
      ansible.builtin.command:
        cmd: git push origin main
        chdir: "{{ _obsidian_repo }}"
      register: _git_push
      changed_when: _git_push.rc == 0
      when: _git_commit.changed

    - name: Display publish result
      ansible.builtin.debug:
        msg: >-
          Report published to Obsidian:
          {{ _report_dir }}/{{ _timestamp_file }}
          (git {{ 'pushed' if _git_push.changed | default(false) else 'no changes' }})