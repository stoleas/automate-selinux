---
- name: Generate SELinux analysis report
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tags:
    - report
  tasks:
    - name: Read AI analysis from file
      ansible.builtin.slurp:
        src: "{{ report_output_dir }}/ai-analysis.json"
      register: _analysis_file
      failed_when: false

    - name: Extract raw AI text (prefer file, fall back to extra var)
      ansible.builtin.set_fact:
        _ai_raw: >-
          {{
            (_analysis_file.content | b64decode)
            if (_analysis_file.content is defined)
            else (selinux_analysis_json | default({}) | to_json)
          }}

    - name: Strip markdown code fences if present (string only)
      ansible.builtin.set_fact:
        _ai_clean: "{{ _ai_raw | regex_replace('(?s)^```json\\s*', '') | regex_replace('(?s)\\s*```\\s*$', '') }}"
      when: _ai_raw | type_debug == 'string'

    - name: Use raw value if already parsed (dict/list)
      ansible.builtin.set_fact:
        _ai_clean: "{{ _ai_raw }}"
      when: _ai_raw | type_debug != 'string'

    - name: Parse AI analysis JSON
      ansible.builtin.set_fact:
        selinux_analysis: "{{ _ai_clean if (_ai_clean | type_debug == 'dict') else (_ai_clean | from_json) }}"

    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ report_output_dir }}"
        state: directory
        mode: "0755"
      failed_when: false

    - name: Render SELinux report
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/selinux-report.md.j2"
        dest: "{{ report_output_dir }}/selinux-report.md"
        mode: "0644"
      failed_when: false

    - name: Read rendered report for display
      ansible.builtin.slurp:
        src: "{{ report_output_dir }}/selinux-report.md"
      register: _report_file
      failed_when: false

    - name: Display full report in job output
      ansible.builtin.debug:
        msg: "{{ (_report_file.content | b64decode) if (_report_file.content is defined) else 'Report rendering failed — check template input' }}"

    - name: Pass report to Orchestrator via set_stats
      ansible.builtin.set_stats:
        data:
          selinux_report_md: "{{ _report_file.content | b64decode }}"
        per_host: false
      when: _report_file.content is defined

    - name: Capture timestamp for archive filename
      ansible.builtin.set_fact:
        _report_timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.time | regex_replace(':', '-') }}"

    - name: Display report location
      ansible.builtin.debug:
        msg: "Report generated: {{ report_output_dir }}/selinux-report.md"

- name: Publish report to Obsidian vault via VM git repo
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags:
    - report
  vars:
    _obsidian_repo: /home/equail/projects/obsidian
    _report_dir: "{{ _obsidian_repo }}/Areas/selinux-lab/reports"
    _timestamp_file: "{{ _report_timestamp }}.report.md"
    _vm_host: "{{ vm_name | default('selinux-demo') }}"
  tasks:
    - name: Read rendered report from controller
      ansible.builtin.set_fact:
        _report_content: "{{ _report_file.content | b64decode }}"
      when: _report_file.content is defined

    - name: Ensure report directory exists in obsidian repo on VM
      ansible.builtin.file:
        path: "{{ _report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: "{{ _vm_host }}"

    - name: Pull latest obsidian repo on VM
      ansible.builtin.command:
        cmd: git pull --ff-only
        chdir: "{{ _obsidian_repo }}"
      register: _git_pull
      changed_when: "'Already up to date' not in _git_pull.stdout"
      delegate_to: "{{ _vm_host }}"

    - name: Write timestamped report to obsidian repo on VM
      ansible.builtin.copy:
        dest: "{{ _report_dir }}/{{ _timestamp_file }}"
        content: "{{ _report_content }}"
        mode: "0644"
      register: _report_write
      delegate_to: "{{ _vm_host }}"

    - name: Git add report on VM
      ansible.builtin.command:
        cmd: "git add {{ _report_dir }}/{{ _timestamp_file }}"
        chdir: "{{ _obsidian_repo }}"
      when: _report_write.changed
      delegate_to: "{{ _vm_host }}"

    - name: Git commit report on VM
      ansible.builtin.command:
        cmd: "git commit -m 'SELinux report: {{ _timestamp_file }}'"
        chdir: "{{ _obsidian_repo }}"
      register: _git_commit
      changed_when: "'nothing to commit' not in _git_commit.stdout"
      when: _report_write.changed
      delegate_to: "{{ _vm_host }}"

    - name: Git push report from VM
      ansible.builtin.command:
        cmd: git push origin main
        chdir: "{{ _obsidian_repo }}"
      register: _git_push
      changed_when: _git_push.rc == 0
      when: _git_commit.changed
      delegate_to: "{{ _vm_host }}"

    - name: Display publish result
      ansible.builtin.debug:
        msg: >-
          Report published to Obsidian:
          {{ _report_dir }}/{{ _timestamp_file }}
          (git {{ 'pushed' if _git_push.changed | default(false) else 'no changes' }})