---
# Playbook: 13 - ServiceNow Check Approval
# Polls a ServiceNow change ticket's approval field until it reaches
# "approved" or "rejected", or the timeout expires.
#
# On the developer instance (dev231222), the change_request state field is
# locked down by a "Change Model: Check State Transition" business rule —
# direct state changes via API are blocked. The approval field is the correct
# indicator: it transitions from "not requested" → "requested" → "approved"
# or "rejected". The approver sets approval="approved" via the UI or API.
#
# Required extra vars (passed from previous Orchestrator node):
#   servicenow_change_sys_id            - sys_id of the change ticket to poll
#   servicenow_api_base                  - ServiceNow REST API base URL
#   servicenow_username                  - ServiceNow API user
#   servicenow_password                  - ServiceNow API password
#   servicenow_approval_timeout_minutes  - overall timeout in minutes
#   servicenow_poll_interval_seconds     - seconds between poll attempts

- name: Poll ServiceNow change ticket for approval
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags:
    - servicenow
  vars:
    # ServiceNow connection defaults — overridden by group_vars if available
    servicenow_instance: "dev231222"
    servicenow_username: "admin"
    servicenow_password: "{{ vault_servicenow_password }}"
    servicenow_api_base: "https://{{ servicenow_instance }}.service-now.com/api/now/table"
    servicenow_approval_timeout_minutes: 30
    servicenow_poll_interval_seconds: 30

  tasks:

    - name: Assert servicenow_change_sys_id is defined and non-empty
      ansible.builtin.assert:
        that:
          - servicenow_change_sys_id is defined
          - servicenow_change_sys_id | trim | length > 0
        fail_msg: >
          Required variable 'servicenow_change_sys_id' is missing or empty.
          It must be passed from the previous Orchestrator node.
        success_msg: "servicenow_change_sys_id is defined: {{ servicenow_change_sys_id }}"

    - name: Calculate max poll retries
      ansible.builtin.set_fact:
        max_retries: "{{ (servicenow_approval_timeout_minutes | int * 60 / servicenow_poll_interval_seconds | int) | int }}"
        poll_interval: "{{ servicenow_poll_interval_seconds | int }}"

    - name: Poll ServiceNow change ticket until approved or rejected
      ansible.builtin.uri:
        url: "{{ servicenow_api_base }}/change_request/{{ servicenow_change_sys_id }}?sysparm_fields=number,approval,state"
        method: GET
        user: "{{ servicenow_username }}"
        password: "{{ servicenow_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: servicenow_change_response
      until: servicenow_change_response.json.result.approval in ['approved', 'rejected']
      retries: "{{ max_retries }}"
      delay: "{{ poll_interval }}"

    - name: Extract final approval status
      ansible.builtin.set_fact:
        servicenow_approval: "{{ servicenow_change_response.json.result.approval }}"
        servicenow_change_number: "{{ servicenow_change_response.json.result.number }}"

    - name: Display final change ticket status
      ansible.builtin.debug:
        msg: >
          ServiceNow change ticket {{ servicenow_change_number }}
          (sys_id: {{ servicenow_change_sys_id }})
          approval: {{ servicenow_approval }}

    - name: Fail if change ticket was not approved
      ansible.builtin.fail:
        msg: >
          ServiceNow change ticket {{ servicenow_change_number }} was {{ servicenow_approval }}.
          Approval is required to proceed with remediation.
      when: servicenow_approval != 'approved'

    - name: Pass servicenow_change_approved to Orchestrator
      ansible.builtin.set_stats:
        data:
          servicenow_change_approved: true
          servicenow_change_number: "{{ servicenow_change_number }}"
        per_host: false