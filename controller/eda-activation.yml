---
# EDA Controller Rulebook Activation Configuration
# Uses event streams (AAP 2.7 pattern) for external webhook ingestion.
#
# Objects created via EDA Controller API (see below) or UI:
#   1. Event stream credential (Basic auth)
#   2. Event stream "selinux-event-stream"
#   3. Project "automate-selinux" (syncs rulebook from git)
#   4. Activation "SELinux Monitor" (links project + event stream)

eda_activations:
  - name: "SELinux Monitor"
    description: "Event stream listener that forwards SELinux events to Automation Orchestrator"
    rulebook: rulebooks/selinux-monitor.yml
    decision_environment: "Default EDA DE"
    project: "automate-selinux"
    restart_policy: on-failure
    enabled: true
    event_streams:
      - name: selinux-event-stream
        source_name: selinux-event-stream

# Event stream URL:
#   https://aap-aap.apps.sno.stoleas.home/eda-event-streams/api/eda/v1/external_event_stream/b86e11ce-d4e0-45bb-a867-9ab79f7c32ad/post/
#
# Trigger with:
#   curl -k -u selinux:redhat123 -X POST \
#     -H "Content-Type: application/json" \
#     -d '{"action": "selinux_analysis", "host": "selinux-demo", "avc_count": "5", "timestamp": "2026-01-01T00:00:00Z"}' \
#     "https://aap-aap.apps.sno.stoleas.home/eda-event-streams/api/eda/v1/external_event_stream/b86e11ce-d4e0-45bb-a867-9ab79f7c32ad/post/"
#
# Action (via event.payload.action):
#   selinux_analysis  - Forward to Orchestrator via job template
#                       Orchestrator runs: AI Analysis -> Report -> Approval -> Remediation
