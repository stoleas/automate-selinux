---
# Provision AAP 2.7 Controller with all objects for the SELinux lab.
#
# Uses infra.aap_configuration dispatch role (CaC for AAP 2.5+).
# Requires: ansible-galaxy collection install -r collections/requirements.yml
#
# Usage:
#   ansible-playbook controller/setup.yml -i localhost, \
#     -e aap_password=<password> \
#     -e credential_ssh_key_file=~/.ssh/id_rsa

- name: Provision AAP Controller for SELinux Lab
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: /api/controller/

  vars:
    # ── AAP Connection ──────────────────────────────────────
    aap_hostname: "{{ lookup('env', 'AAP_HOSTNAME') | default('https://aap-aap.apps.sno.stoleas.home', true) }}"
    aap_username: "{{ lookup('env', 'AAP_USERNAME') | default('admin', true) }}"
    aap_password: "{{ lookup('env', 'AAP_PASSWORD') }}"
    aap_validate_certs: false

    # ── Naming ──────────────────────────────────────────────
    organization: Default
    project_name: "SELinux Automated Remediation"
    project_scm_url: "git@github.com:stoleas/automate-selinux.git"
    project_scm_branch: main
    inventory_name: "SELinux Lab"
    machine_credential_name: "SELinux Lab Machine Credential"
    vault_credential_name: "SELinux Lab Vault Credential"
    scm_credential_name: "SELinux Lab SCM Credential"

    credential_ssh_key_file: "~/.ssh/id_rsa"
    credential_vault_password: ""

    vm_name: "selinux-demo"
    kvm_host_name: main1
    kvm_host_ip: "192.168.86.10"

    # ── Orchestrator ──────────────────────────────────────────
    orchestrator_url: "https://automa-d61a1901-automation-orchestrator-automation-orchestrator.apps.sno.stoleas.home"
    orchestrator_credential_name: "Automation Orchestrator"

    # ── infra.aap_configuration data ────────────────────────

    controller_credential_types:
      - name: "Orchestrator Credential"
        kind: cloud
        inputs:
          fields:
            - id: orchestrator_url
              type: string
              label: Orchestrator URL
            - id: orchestrator_username
              type: string
              label: Username
            - id: orchestrator_password
              type: string
              label: Password
              secret: true
        injectors:
          extra_vars:
            orchestrator_url: !unsafe "{{ orchestrator_url }}"
            orchestrator_username: !unsafe "{{ orchestrator_username }}"
            orchestrator_password: !unsafe "{{ orchestrator_password }}"

    controller_projects:
      - name: "{{ project_name }}"
        organization: "{{ organization }}"
        scm_type: git
        scm_url: "{{ project_scm_url }}"
        scm_branch: "{{ project_scm_branch }}"
        scm_update_on_launch: true
        credential: "{{ scm_credential_name }}"
        update_project: "{{ controller_update_project | default(false) }}"
        wait: true

    controller_inventories:
      - name: "{{ inventory_name }}"
        organization: "{{ organization }}"
        variables:
          vm_name: selinux-demo
          vm_bridge: bridge0
          vm_vcpus: 2
          vm_memory_mb: 4096
          vm_disk_gb: 20
          selinux_policy: targeted
          observation_period_minutes: 5
          report_output_dir: ./reports

    controller_hosts:
      - name: "{{ kvm_host_name }}"
        inventory: "{{ inventory_name }}"
        variables:
          ansible_host: "{{ kvm_host_ip }}"
          ansible_user: equail
          ansible_connection: ssh
          libvirt_uri: "qemu:///system"
      - name: "{{ vm_name }}"
        inventory: "{{ inventory_name }}"
        variables:
          ansible_host: "{{ vm_ip | default('192.168.86.196') }}"
          ansible_user: equail

    controller_groups:
      - name: kvm_hosts
        inventory: "{{ inventory_name }}"
        hosts:
          - "{{ kvm_host_name }}"
      - name: rhel_vms
        inventory: "{{ inventory_name }}"
        hosts:
          - "{{ vm_name }}"

    controller_credentials:
      - name: "{{ scm_credential_name }}"
        organization: "{{ organization }}"
        credential_type: "Source Control"
        inputs:
          ssh_key_data: "{{ lookup('file', credential_ssh_key_file) }}"
      - name: "{{ machine_credential_name }}"
        organization: "{{ organization }}"
        credential_type: Machine
        inputs:
          username: equail
          ssh_key_data: "{{ lookup('file', credential_ssh_key_file) }}"
          become_method: sudo
      - name: "{{ vault_credential_name }}"
        organization: "{{ organization }}"
        credential_type: Vault
        inputs: "{{ {'vault_password': credential_vault_password} if credential_vault_password | length > 0 else {} }}"
      - name: "{{ orchestrator_credential_name }}"
        organization: "{{ organization }}"
        credential_type: "Orchestrator Credential"
        inputs:
          orchestrator_url: "{{ orchestrator_url }}"
          orchestrator_username: "{{ orchestrator_user | default('admin') }}"
          orchestrator_password: "{{ orchestrator_pass | default('') }}"

    controller_templates:
      - name: "SELinux - Provision VM"
        description: "Provision RHEL 10.2 VM with SELinux disabled and install demo app"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/01-provision-vm.yml
        inventory: "{{ inventory_name }}"
        credentials:
          - "{{ machine_credential_name }}"
          - "{{ vault_credential_name }}"

      - name: "SELinux - Snapshot Baseline"
        description: "Snapshot VM with SELinux disabled baseline"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/02-snapshot-baseline.yml
        inventory: "{{ inventory_name }}"
        credentials:
          - "{{ machine_credential_name }}"
          - "{{ vault_credential_name }}"

      - name: "SELinux - Restore Snapshot"
        description: "Restore VM to SELinux-disabled baseline snapshot"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/03-restore-snapshot.yml
        inventory: "{{ inventory_name }}"
        credentials:
          - "{{ machine_credential_name }}"
          - "{{ vault_credential_name }}"

      - name: "SELinux - Enable Permissive"
        description: "Switch SELinux to permissive, configure auditd, relabel filesystem"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/04-enable-selinux-permissive.yml
        inventory: "{{ inventory_name }}"
        credentials:
          - "{{ machine_credential_name }}"
          - "{{ vault_credential_name }}"

      - name: "SELinux - Snapshot Permissive"
        description: "Snapshot VM in SELinux permissive state after relabel and AVC generation"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/05-snapshot-permissive.yml
        inventory: "{{ inventory_name }}"
        credentials:
          - "{{ machine_credential_name }}"
          - "{{ vault_credential_name }}"

      - name: "SELinux - Collect AVC Logs"
        description: "Collect AVC denials and audit2allow output from target VM"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/06-collect-avc-logs.yml
        inventory: "{{ inventory_name }}"
        credentials:
          - "{{ machine_credential_name }}"
          - "{{ vault_credential_name }}"

      - name: "SELinux - AI Analysis"
        description: "Send AVC findings to Vertex AI for analysis and recommendations"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/07-ai-analysis.yml
        inventory: "{{ inventory_name }}"
        credentials:
          - "{{ vault_credential_name }}"

      - name: "SELinux - Generate Report"
        description: "Generate markdown report from AI analysis"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/08-generate-report.yml
        inventory: "{{ inventory_name }}"
        ask_variables_on_launch: true
        credentials:
          - "{{ vault_credential_name }}"
          - "{{ machine_credential_name }}"

      - name: "SELinux - Apply Remediation"
        description: "Apply AI-recommended SELinux remediations to target VM"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/09-apply-remediation.yml
        inventory: "{{ inventory_name }}"
        ask_variables_on_launch: true
        credentials:
          - "{{ machine_credential_name }}"
          - "{{ vault_credential_name }}"

      - name: "SELinux - Collect and Notify"
        description: "Collect AVC denials from target VM and send event to EDA for Orchestrator processing"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/10-collect-and-notify.yml
        inventory: "{{ inventory_name }}"
        credentials:
          - "{{ machine_credential_name }}"
          - "{{ vault_credential_name }}"

      - name: "SELinux - Forward to Orchestrator"
        description: "Forward EDA event to Automation Orchestrator webhook"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/11-forward-to-orchestrator.yml
        inventory: "{{ inventory_name }}"
        ask_variables_on_launch: true
        credentials:
          - "{{ orchestrator_credential_name }}"

      - name: "SELinux - Create ServiceNow Change"
        description: "Create a Normal Change ticket in ServiceNow for remediation approval"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/12-servicenow-create-change.yml
        inventory: "{{ inventory_name }}"
        ask_variables_on_launch: true
        credentials:
          - "{{ vault_credential_name }}"

      - name: "SELinux - Check ServiceNow Approval"
        description: "Poll ServiceNow change ticket until approved, rejected, or timeout"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/13-servicenow-check-approval.yml
        inventory: "{{ inventory_name }}"
        ask_variables_on_launch: true
        credentials:
          - "{{ vault_credential_name }}"

      - name: "SELinux - Post-Remediation Observation"
        description: "Re-collect AVCs after remediation, compare to pre-remediation count"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/14-observe-post-remediation.yml
        inventory: "{{ inventory_name }}"
        ask_variables_on_launch: true
        credentials:
          - "{{ machine_credential_name }}"

      - name: "SELinux - ServiceNow Setup"
        description: "Set up ServiceNow demo artifacts: assignment group, CMDB CI, email notifications"
        organization: "{{ organization }}"
        project: "{{ project_name }}"
        playbook: playbooks/15-servicenow-setup.yml
        inventory: "{{ inventory_name }}"
        credentials:
          - "{{ vault_credential_name }}"

  roles:
    - infra.aap_configuration.dispatch

  post_tasks:
    - name: Display setup summary
      ansible.builtin.debug:
        msg: |
          AAP Controller provisioned successfully.

          Project:    {{ project_name }}
          Inventory:  {{ inventory_name }} (host: {{ kvm_host_name }} / {{ kvm_host_ip }})
          Credentials: {{ machine_credential_name }}, {{ vault_credential_name }}, {{ orchestrator_credential_name }}
          Job Templates: 15
          Workflows: none (managed by Automation Orchestrator)

          Next steps:
          1. Verify credentials in AAP UI (add SSH key / vault password / orchestrator password if not set)
          2. Sync the project in AAP
          3. Run: bash orchestrator/setup.sh  (creates Orchestrator workflow)
          4. Launch "SELinux - Collect and Notify" to trigger the Orchestrator flow
