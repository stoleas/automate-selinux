---
# ── AI / LLM ────────────────────────────────────────────────────────────────
# OpenAI-compatible proxy URL (e.g. "http://my-proxy:8787")
vertex_ai_proxy_url: ""

# ── VM Settings ─────────────────────────────────────────────────────────────
vm_name: "selinux-demo"
vm_bridge: "bridge0"
vm_vcpus: 2
vm_memory_mb: 4096
vm_disk_gb: 20
rhel_iso_path: "/var/lib/libvirt/images/rhel-10.2-x86_64-boot.iso"

# ── SELinux ─────────────────────────────────────────────────────────────────
selinux_policy: "targeted"
selinux_policy_module_name: "selinux_demo_policy"
observation_period_minutes: 0

report_output_dir: "{{ playbook_dir }}/../reports"

# ── Automation Orchestrator ─────────────────────────────────────────────────
# e.g. "https://orchestrator.example.com"
orchestrator_url: ""

# ── EDA Event Stream ────────────────────────────────────────────────────────
# Set aap_hostname and eda_event_stream_id to build the webhook URL.
aap_hostname: ""
eda_event_stream_id: ""
eda_webhook_url: "https://{{ aap_hostname }}/eda-event-streams/api/eda/v1/external_event_stream/{{ eda_event_stream_id }}/post/"
eda_webhook_user: "selinux"
eda_webhook_password: "{{ vault_eda_webhook_password }}"

# ── ServiceNow ──────────────────────────────────────────────────────────────
servicenow_instance: "dev231222"  # ServiceNow developer instance
servicenow_username: "admin"
servicenow_password: "{{ vault_servicenow_password }}"
servicenow_api_base: "https://{{ servicenow_instance }}.service-now.com/api/now/table"
servicenow_change_type: "normal"
servicenow_assignment_group: ""  # sys_id of the group, discover via API
servicenow_approval_timeout_minutes: 30  # how long to poll for approval
servicenow_poll_interval_seconds: 30  # poll frequency

# ── Secrets (vault-encrypted) ──────────────────────────────────────────────
vm_root_password: "{{ vault_vm_root_password }}"
vm_user_password: "{{ vault_vm_user_password }}"
rhsm_username: "{{ vault_rhsm_username }}"
rhsm_password: "{{ vault_rhsm_password }}"
