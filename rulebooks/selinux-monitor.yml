---
- name: SELinux Event Stream Monitor
  hosts: all
  sources:
    - ansible.eda.generic:
        source_name: selinux-event-stream
  rules:
    - name: Forward SELinux analysis to Orchestrator
      condition: event.payload.action == "selinux_analysis"
      action:
        run_job_template:
          name: "SELinux - Forward to Orchestrator"
          organization: Default
          job_args:
            extra_vars:
              orchestrator_event: "{{ event }}"

