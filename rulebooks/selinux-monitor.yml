---
- name: SELinux Automated Remediation Trigger
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Forward SELinux analysis to Orchestrator
      condition: event.payload.action == "selinux_analysis"
      action:
        run_job_template:
          name: "SELinux - Forward to Orchestrator"
          organization: Default
          job_args:
            extra_vars:
              orchestrator_event: "{{ event }}"

    - name: Launch SELinux analysis on webhook trigger (direct)
      condition: event.payload.action == "analyze_selinux"
      action:
        run_workflow_template:
          name: "SELinux Automated Remediation"
          organization: Default

    - name: Launch full pipeline on provision trigger (direct)
      condition: event.payload.action == "full_pipeline"
      action:
        run_workflow_template:
          name: "SELinux Full Pipeline"
          organization: Default
