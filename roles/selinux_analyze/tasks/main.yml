---
# --- Load collected data ---

- name: Read AVC denials from file
  ansible.builtin.slurp:
    src: "{{ report_output_dir }}/avc-denials.log"
  register: _avc_file
  failed_when: false

- name: Read audit2allow suggestions from file
  ansible.builtin.slurp:
    src: "{{ report_output_dir }}/audit2allow-suggestions.txt"
  register: _audit2allow_file
  failed_when: false

- name: Resolve AVC data (prefer file, fall back to workflow stats)
  ansible.builtin.set_fact:
    _avc_data: "{{ (_avc_file.content | b64decode) if (_avc_file.content is defined) else (avc_denials_raw | default('')) }}"
    _audit2allow_data: "{{ (_audit2allow_file.content | b64decode) if (_audit2allow_file.content is defined) else (audit2allow_suggestions | default('')) }}"

- name: Fail if no AVC data available
  ansible.builtin.fail:
    msg: "No AVC denial data found — neither report files nor workflow stats are available"
  when: _avc_data | length == 0

# --- Build and send AI prompt ---

- name: Build AI analysis prompt
  ansible.builtin.set_fact:
    _ai_prompt: "{{ lookup('template', 'ai-prompt.j2') }}"
  vars:
    avc_denials: "{{ _avc_data }}"
    audit2allow_output: "{{ _audit2allow_data }}"

- name: Send findings to Vertex AI for analysis
  ansible.builtin.uri:
    url: "{{ vertex_ai_proxy_url }}{{ ai_proxy_endpoint }}"
    method: POST
    body_format: json
    body:
      model: "{{ ai_model }}"
      messages:
        - role: user
          content: "{{ _ai_prompt }}"
      temperature: 0.1
    headers:
      Content-Type: "application/json"
    status_code: 200
    timeout: "{{ ai_request_timeout }}"
  register: _ai_response

# --- Parse and save response ---

- name: Extract AI analysis from response
  ansible.builtin.set_fact:
    _ai_raw: "{{ _ai_response.json.choices[0].message.content }}"

- name: Parse AI analysis (strip code fences if present)
  ansible.builtin.set_fact:
    selinux_analysis: >-
      {{ (_ai_raw is string) |
         ternary(_ai_raw | regex_replace('(?s)^```json\s*', '') | regex_replace('(?s)\s*```\s*$', '') | from_json,
                 _ai_raw) }}

- name: Save AI analysis to file
  ansible.builtin.copy:
    content: "{{ selinux_analysis | to_nice_json }}"
    dest: "{{ report_output_dir }}/ai-analysis.json"
    mode: "0644"

- name: Pass AI analysis to next workflow node via set_stats
  ansible.builtin.set_stats:
    data:
      selinux_analysis_json: "{{ selinux_analysis | to_json }}"
    per_host: false

- name: Display AI analysis summary
  ansible.builtin.debug:
    msg: |
      === AI Analysis Summary ===
      {{ selinux_analysis.summary }}

      Findings: {{ selinux_analysis.findings | length }}
      {% for f in selinux_analysis.findings %}
      {{ loop.index }}. [{{ f.remediation.type }}] {{ f.denial }}
      {% endfor %}

      audit2allow assessment: {{ selinux_analysis.audit2allow_assessment }}
